name: Build Ladybird Android (arm64 + armv7)

# Based on Ladybird's own Nightly Android job (macOS runner), with our custom
# Compose UI and dual-ABI release packaging.

on:
  push:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  LADYBIRD_CACHE_DIR: ${{ github.workspace }}/Build/caches
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compute version
        id: ver
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=1.0-expressive-$DATE-$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$DATE-$SHA" >> "$GITHUB_OUTPUT"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool pkg-config nasm ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;35.0.0" "platforms;android-35" \
            "cmake;3.31.6" "ndk;29.0.13599879" > /dev/null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-macos-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-macos-android-

      - name: Set up vcpkg (Ladybird bootstrap)
        run: python3 Meta/ladybird.py vcpkg --preset Release

      - name: Give meson cross-ports a real native compiler
        run: |
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['VCPKG_ROOT']) / 'scripts/buildsystems/meson/none.txt'
          p.write_text('''[host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [properties]

          [binaries]
          c = '/usr/bin/gcc'
          cpp = '/usr/bin/g++'
          ar = '/usr/bin/ar'
          strip = '/usr/bin/strip'
          pkgconfig = '/usr/bin/pkg-config'
          '''.replace('\n          ', '\n'))
          print(p.read_text())
          PY

      - name: Stamp version and build both ABIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('UI/Android/build.gradle.kts')
          s = p.read_text()
          date = os.environ['BUILD_DATE']
          version = os.environ['VERSION_NAME']
          s = s.replace('versionCode = 1', f'versionCode = {date}')
          s = s.replace('versionName = "1.0"', f'versionName = "{version}"')
          p.write_text(s)
          PY
          build_abi() {
            ABI="$1"; LABEL="$2"
            echo "===== Building Ladybird engine for $ABI ====="
            python3 - "$ABI" <<'PY'
          import sys, pathlib
          abi = sys.argv[1]
          p = pathlib.Path('UI/Android/build.gradle.kts')
          lines = p.read_text().splitlines()
          lines = [('            abiFilters += listOf("' + abi + '")') if 'abiFilters += listOf' in l else l for l in lines]
          p.write_text('\n'.join(lines) + '\n')
          PY
            grep -n abiFilters UI/Android/build.gradle.kts
            rm -rf UI/Android/.cxx UI/Android/build
            ( cd UI/Android && ./gradlew --no-daemon assembleRelease )
            UNSIGNED=$(find UI/Android/build/outputs/apk/release -name '*.apk' | head -n 1)
            cp "$UNSIGNED" "${LABEL}-unsigned.apk"
          }
          build_abi arm64-v8a arm64
          build_abi armeabi-v7a armv7
        env:
          GRADLE_OPTS: '-Xmx3072m'
          BUILD_DATE: ${{ steps.ver.outputs.date }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}

      - name: Sign APKs
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore release.keystore -alias ladybird \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ladybird-sign-2026 -keypass ladybird-sign-2026 \
            -dname "CN=Ladybird Engine, OU=CI, O=niggetron, L=Internet, S=Internet, C=US"
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          for LABEL in arm64 armv7; do
            "$BT/zipalign" -f 4 "${LABEL}-unsigned.apk" "${LABEL}-aligned.apk"
            "$BT/apksigner" sign --ks release.keystore \
              --ks-pass pass:ladybird-sign-2026 --key-pass pass:ladybird-sign-2026 \
              --out "LadybirdEngine-${{ steps.ver.outputs.version }}-${LABEL}.apk" "${LABEL}-aligned.apk"
            "$BT/apksigner" verify "LadybirdEngine-${{ steps.ver.outputs.version }}-${LABEL}.apk"
          done

      - name: Publish release
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "LadybirdEngine-${{ steps.ver.outputs.version }}-arm64.apk" \
            "LadybirdEngine-${{ steps.ver.outputs.version }}-armv7.apk" \
            --title "Ladybird Engine ${{ steps.ver.outputs.version }}" \
            --notes "Ladybird engine for Android with our own Material 3 expressive Compose UI (vertical tabs, arc bar). Both arm64-v8a and armeabi-v7a APKs included." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
