name: Build Ladybird Android (arm64 + armv7)

# Based on Ladybird's own Nightly Android job (macOS runner), with our custom
# Compose UI and dual-ABI release packaging.

on:
  push:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  LADYBIRD_CACHE_DIR: ${{ github.workspace }}/Build/caches
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
  VCPKG_INSTALL_OPTIONS: --allow-unsupported

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compute version
        id: ver
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=1.0-expressive-$DATE-$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$DATE-$SHA" >> "$GITHUB_OUTPUT"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool pkg-config nasm ninja-build libgl1-mesa-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;35.0.0" "platforms;android-35" \
            "cmake;3.31.6" "ndk;29.0.13599879" > /dev/null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-macos-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-macos-android-

      - name: Set up vcpkg (Ladybird bootstrap)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          for i in 1 2 3; do
            if python3 Meta/ladybird.py vcpkg --preset Release; then exit 0; fi
            echo "vcpkg bootstrap failed, retry $i"
            rm -rf Build/vcpkg
          done
          exit 1

      - name: Pre-cache all vcpkg GitHub patches
        run: |
          mkdir -p Build/vcpkg/downloads
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/PointCloudLibrary/pcl/pull/6253/commits/011905f3387e45b66828d81dacaafdde8893fdcb.patch?full_index=1" -o "Build/vcpkg/downloads/fix-no-gluErrorString.patch" || echo "failed: fix-no-gluErrorString.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/RainerKuemmerle/g2o/commit/100af05931ae3497f39ab42cbeba240f50cc7b66.patch?full_index=1" -o "Build/vcpkg/downloads/g2o-100af05931ae3497f39ab42cbeba240f50cc7b66.patch" || echo "failed: g2o-100af05931ae3497f39ab42cbeba240f50cc7b66.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/RainerKuemmerle/g2o/commit/37d17a94594648acf9cce85e8483c0405c510f0d.patch?full_index=1" -o "Build/vcpkg/downloads/g2o-37d17a94594648acf9cce85e8483c0405c510f0d.patch" || echo "failed: g2o-37d17a94594648acf9cce85e8483c0405c510f0d.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/apache/brpc/commit/282776acaf2c894791d2b5d4c294a28cfa2d4138.patch?full_index=1" -o "Build/vcpkg/downloads/282776acaf2c894791d2b5d4c294a28cfa2d4138.patch" || echo "failed: 282776acaf2c894791d2b5d4c294a28cfa2d4138.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/apache/brpc/commit/8d1ee6d06ffdf84a33bd083463663ece5fb9e7a9.patch?full_index=1" -o "Build/vcpkg/downloads/8d1ee6d06ffdf84a33bd083463663ece5fb9e7a9.patch" || echo "failed: 8d1ee6d06ffdf84a33bd083463663ece5fb9e7a9.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/baidu/braft/commit/361ef01185b88baf90b7926f992c8e71fc4aefc2.patch?full_index=1" -o "Build/vcpkg/downloads/361ef01185b88baf90b7926f992c8e71fc4aefc2.patch" || echo "failed: 361ef01185b88baf90b7926f992c8e71fc4aefc2.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/boostorg/interprocess/commit/f58e968f13e693ffaa78fb283972e8598dc48c9f.patch?full_index=1" -o "Build/vcpkg/downloads/boost-interprocess-arm32-f58e968f13e693ffaa78fb283972e8598dc48c9f.patch" || echo "failed: boost-interprocess-arm32-f58e968f13e693ffaa78fb283972e8598dc48c9f.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/devernay/cminpack/commit/0d40c5359674448aa6f78accaddca1d79befff1f.patch?full_index=1" -o "Build/vcpkg/downloads/devernay-cminpack-pr-50-dllexport.patch" || echo "failed: devernay-cminpack-pr-50-dllexport.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/google/double-conversion/commit/101e1ba89dc41ceb75090831da97c43a76cd2906.patch?full_index=1" -o "Build/vcpkg/downloads/google-double-conversion-101e1ba89dc41ceb75090831da97c43a76cd2906.patch" || echo "failed: google-double-conversion-101e1ba89dc41ceb75090831da97c43a76cd2906.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/ivafanas/sltbench/commit/ec702203f406d3b1db71dac6bd39337d175cdc2c.patch?full_index=1" -o "Build/vcpkg/downloads/ec702203f406d3b1db71dac6bd39337d175cdc2c.patch" || echo "failed: ec702203f406d3b1db71dac6bd39337d175cdc2c.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/libsese/sese/commit/59fa66d24996eceddc2c406b043687cd13a741dd.patch?full_index=1" -o "Build/vcpkg/downloads/libsese-sese-2.3.0-59fa66d24996eceddc2c406b043687cd13a741dd.patch" || echo "failed: libsese-sese-2.3.0-59fa66d24996eceddc2c406b043687cd13a741dd.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/lu-zero/mfx_dispatch/commit/d6241243f85a0d947bdfe813006686a930edef24.patch?full_index=1" -o "Build/vcpkg/downloads/fix-missing-cstdint-import-d6241243f85a0d947bdfe813006686a930edef24.patch" || echo "failed: fix-missing-cstdint-import-d6241243f85a0d947bdfe813006686a930edef24.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/master-keying/minisat/commit/dde8a20c9c5ab0d2333ba7a338a7f4a769632b75.patch?full_index=1" -o "Build/vcpkg/downloads/dde8a20c9c5ab0d2333ba7a338a7f4a769632b75.patch" || echo "failed: dde8a20c9c5ab0d2333ba7a338a7f4a769632b75.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/mavam/libbf/commit/7720a2cdfdf211ac10d5f9c5b0988e1cae03d3ba.patch?full_index=1" -o "Build/vcpkg/downloads/7720a2cdfdf211ac10d5f9c5b0988e1cae03d3ba.patch" || echo "failed: 7720a2cdfdf211ac10d5f9c5b0988e1cae03d3ba.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/mavam/libbf/commit/b2168dc4590a0251ec40ada4ab835eb3aec893e7.patch?full_index=1" -o "Build/vcpkg/downloads/b2168dc4590a0251ec40ada4ab835eb3aec893e7.patch" || echo "failed: b2168dc4590a0251ec40ada4ab835eb3aec893e7.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/microsoft/cppgraphqlgen/commit/aa02e66edcf248c61a198eec546c401c3ada3667.patch?full_index=1" -o "Build/vcpkg/downloads/fix-linux.patch" || echo "failed: fix-linux.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/openssl/openssl/commit/2b5e7253b9a6a4cde64d3f2f22d71272f6ad32c5.patch?full_index=1" -o "Build/vcpkg/downloads/openssl-certstore-crash-2b5e7253b9a6a4cde64d3f2f22d71272f6ad32c5.patch" || echo "failed: openssl-certstore-crash-2b5e7253b9a6a4cde64d3f2f22d71272f6ad32c5.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/ousnius/nifly/commit/a16057e349b9cbee53d9618b22d3e235505f0df0.patch?full_index=1" -o "Build/vcpkg/downloads/a16057e349b9cbee53d9618b22d3e235505f0df0.patch" || echo "failed: a16057e349b9cbee53d9618b22d3e235505f0df0.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/pkgconf/pkgconf/commit/664b53d5c4920e66e4a57c7515ccfd1bd1477bac.patch?full_index=1" -o "Build/vcpkg/downloads/pkgconf-add-missing-define-664b53d5c4920e66e4a57c7515ccfd1bd1477bac.patch" || echo "failed: pkgconf-add-missing-define-664b53d5c4920e66e4a57c7515ccfd1bd1477bac.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/pytorch/pytorch/commit/2a440348958b3f0a2b09458bd76fe5959b371c0c.patch?full_index=1" -o "Build/vcpkg/downloads/libtorch-cuda-thrust-missing-header-2a440348958b3f0a2b09458bd76fe5959b371c0c.patch" || echo "failed: libtorch-cuda-thrust-missing-header-2a440348958b3f0a2b09458bd76fe5959b371c0c.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/pytorch/pytorch/commit/e14026bc2a6cd80bedffead77a5d7b75a37f8e67.patch?full_index=1" -o "Build/vcpkg/downloads/libtorch-cudnn-9-fix-e14026bc2a6cd80bedffead77a5d7b75a37f8e67.patch" || echo "failed: libtorch-cudnn-9-fix-e14026bc2a6cd80bedffead77a5d7b75a37f8e67.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/reo7sp/tgbot-cpp/commit/0a89870157a1f8ad546a5336bb4717f8700911d5.patch?full_index=1" -o "Build/vcpkg/downloads/fix-asio-error.patch" || echo "failed: fix-asio-error.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/robotraconteur/robotraconteur/commit/0fe6efd8c448f68ae6c33c261b9df734b372ee47.patch?full_index=1" -o "Build/vcpkg/downloads/robotraconteur-openssl-dependencies-0fe6efd8c448f68ae6c33c261b9df734b372ee47.patch" || echo "failed: robotraconteur-openssl-dependencies-0fe6efd8c448f68ae6c33c261b9df734b372ee47.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/slembcke/Chipmunk2D/commit/9a051e6fb970c7afe09ce2d564c163b81df050a8.patch?full_index=1" -o "Build/vcpkg/downloads/9a051e6fb970c7afe09ce2d564c163b81df050a8.patch" || echo "failed: 9a051e6fb970c7afe09ce2d564c163b81df050a8.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/sogou/srpc/commit/bb882f98820bff7fa91aa83b29640fa753e11772.patch?full_index=1" -o "Build/vcpkg/downloads/bb882f98820bff7fa91aa83b29640fa753e11772.patch" || echo "failed: bb882f98820bff7fa91aa83b29640fa753e11772.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/spnda/fastgltf/commit/279d960eee4c85690c90df92ce0bdc121a6233f4.patch?full_index=1" -o "Build/vcpkg/downloads/spnda-fastgltf-v0.8.0-279d960eee4c85690c90df92ce0bdc121a6233f4.patch" || echo "failed: spnda-fastgltf-v0.8.0-279d960eee4c85690c90df92ce0bdc121a6233f4.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/spnda/fastgltf/commit/5278229d48e06d4770ecfea97402bbe1c8380038.patch?full_index=1" -o "Build/vcpkg/downloads/spnda-fastgltf-v0.8.0-5278229d48e06d4770ecfea97402bbe1c8380038.patch" || echo "failed: spnda-fastgltf-v0.8.0-5278229d48e06d4770ecfea97402bbe1c8380038.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/spnda/fastgltf/commit/e42df8b70d42f62fa9c678c23213e9cb649b9060.patch?full_index=1" -o "Build/vcpkg/downloads/spnda-fastgltf-v0.8.0-e42df8b70d42f62fa9c678c23213e9cb649b9060.patch" || echo "failed: spnda-fastgltf-v0.8.0-e42df8b70d42f62fa9c678c23213e9cb649b9060.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/stevenlovegrove/Pangolin/commit/0bb8f1b4969f248254e4c4051c053304f86e3c6a.patch?full_index=1" -o "Build/vcpkg/downloads/pangolin-initialise-pad_.patch" || echo "failed: pangolin-initialise-pad_.patch"
          curl --retry 6 --retry-all-errors -fsSL "https://github.com/t43rr7/libcgroup/commit/592dcdcf243576bd2517d3da9bc18990de08e37e.patch?full_index=1" -o "Build/vcpkg/downloads/0000-fix-systemd-header-installation.patch" || echo "failed: 0000-fix-systemd-header-installation.patch"
          ls Build/vcpkg/downloads/*.patch | wc -l

      - name: Patch libproxy port for Android (no -lpthread)
        run: |
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['VCPKG_ROOT']) / 'ports/libproxy/portfile.cmake'
          s = p.read_text()
          assert '-DWITH_WEBKIT3=OFF' in s
          s = s.replace('-DWITH_WEBKIT3=OFF', '-DCMAKE_THREAD_LIBS_INIT= -DWITH_WEBKIT3=OFF', 1)
          p.write_text(s)
          print('patched libproxy portfile')
          PY

      - name: Give meson cross-ports a real native compiler
        run: |
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['VCPKG_ROOT']) / 'scripts/buildsystems/meson/none.txt'
          p.write_text('''[host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [properties]

          [binaries]
          c = '/usr/bin/gcc'
          cpp = '/usr/bin/g++'
          ar = '/usr/bin/ar'
          strip = '/usr/bin/strip'
          pkgconfig = '/usr/bin/pkg-config'
          '''.replace('\n          ', '\n'))
          print(p.read_text())
          PY

      - name: Stamp version and build both ABIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('UI/Android/build.gradle.kts')
          s = p.read_text()
          date = os.environ['BUILD_DATE']
          version = os.environ['VERSION_NAME']
          s = s.replace('versionCode = 1', f'versionCode = {date}')
          s = s.replace('versionName = "1.0"', f'versionName = "{version}"')
          s = s.replace('"-DVCPKG_TARGET_ANDROID=ON"', '"-DVCPKG_TARGET_ANDROID=ON", "-DVCPKG_INSTALL_OPTIONS=--allow-unsupported"')
          p.write_text(s)
          PY
          build_abi() {
            ABI="$1"; LABEL="$2"
            echo "===== Building Ladybird engine for $ABI ====="
            python3 - "$ABI" <<'PY'
          import sys, pathlib
          abi = sys.argv[1]
          p = pathlib.Path('UI/Android/build.gradle.kts')
          lines = p.read_text().splitlines()
          lines = [('            abiFilters += listOf("' + abi + '")') if 'abiFilters += listOf' in l else l for l in lines]
          p.write_text('\n'.join(lines) + '\n')
          PY
            grep -n abiFilters UI/Android/build.gradle.kts
            rm -rf UI/Android/.cxx UI/Android/build
            ( cd UI/Android && ./gradlew --no-daemon assembleRelease )
            UNSIGNED=$(find UI/Android/build/outputs/apk/release -name '*.apk' | head -n 1)
            cp "$UNSIGNED" "${LABEL}-unsigned.apk"
          }
          build_abi arm64-v8a arm64
          build_abi armeabi-v7a armv7
        env:
          GRADLE_OPTS: '-Xmx3072m'
          BUILD_DATE: ${{ steps.ver.outputs.date }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}

      - name: Sign APKs
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore release.keystore -alias ladybird \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ladybird-sign-2026 -keypass ladybird-sign-2026 \
            -dname "CN=Ladybird Engine, OU=CI, O=niggetron, L=Internet, S=Internet, C=US"
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          for LABEL in arm64 armv7; do
            "$BT/zipalign" -f 4 "${LABEL}-unsigned.apk" "${LABEL}-aligned.apk"
            "$BT/apksigner" sign --ks release.keystore \
              --ks-pass pass:ladybird-sign-2026 --key-pass pass:ladybird-sign-2026 \
              --out "LadybirdEngine-${{ steps.ver.outputs.version }}-${LABEL}.apk" "${LABEL}-aligned.apk"
            "$BT/apksigner" verify "LadybirdEngine-${{ steps.ver.outputs.version }}-${LABEL}.apk"
          done

      - name: Dump vcpkg failure logs
        if: failure()
        run: |
          echo "===== skia build logs ====="
          find Build/vcpkg/buildtrees/skia -type f \( -name '*-out.log' -o -name '*-err.log' \) 2>/dev/null | while read -r f; do
            echo "----- $f -----"
            tail -120 "$f" || true
          done
          echo "===== manifest install log ====="
          find . -name 'vcpkg-manifest-install.log' -type f 2>/dev/null | while read -r f; do
            echo "----- $f -----"
            tail -150 "$f" || true
          done

      - name: Publish release
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "LadybirdEngine-${{ steps.ver.outputs.version }}-arm64.apk" \
            "LadybirdEngine-${{ steps.ver.outputs.version }}-armv7.apk" \
            --title "Ladybird Engine ${{ steps.ver.outputs.version }}" \
            --notes "Ladybird engine for Android with our own Material 3 expressive Compose UI (vertical tabs, arc bar). Both arm64-v8a and armeabi-v7a APKs included." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
